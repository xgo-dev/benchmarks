# Pinned module inputs for the generated 200-package compatibility manifest.
# Limits are intentionally reviewed: changing package membership changes the
# release-to-release compatibility contract.

[[Projects]]
  NamePrefix = "etcd_pkg"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/pkg/v3"
  Pattern = "go.etcd.io/etcd/pkg/v3/..."
  Version = "v3.6.14"
  Limit = 15
  # These packages either timed out or failed the Go baseline in the first
  # full hosted run, so they cannot provide a meaningful LLGo comparison.
  Exclude = [
    "go.etcd.io/etcd/pkg/v3/expect",
    "go.etcd.io/etcd/pkg/v3/proxy",
  ]

[[Projects]]
  NamePrefix = "etcd_client_pkg"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/client/pkg/v3"
  Pattern = "go.etcd.io/etcd/client/pkg/v3/..."
  Version = "v3.6.14"
  Limit = 8

[[Projects]]
  NamePrefix = "etcd_api"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/api/v3"
  Pattern = "go.etcd.io/etcd/api/v3/..."
  Version = "v3.6.14"
  Limit = 3

[[Projects]]
  NamePrefix = "protobuf"
  Project = "protobuf-go"
  ProjectURL = "https://github.com/protocolbuffers/protobuf-go"
  Module = "google.golang.org/protobuf"
  Pattern = "google.golang.org/protobuf/..."
  Version = "v1.36.11"
  Limit = 35
  # Exclude packages that produced runner-heavy output or failed the Go
  # baseline in the first full hosted run.
  Exclude = [
    "google.golang.org/protobuf/encoding/protojson",
    "google.golang.org/protobuf/internal/fuzz/jsonfuzz",
    "google.golang.org/protobuf/internal/fuzz/textfuzz",
    "google.golang.org/protobuf/internal/fuzz/wirefuzz",
  ]

[[Projects]]
  NamePrefix = "gonum"
  Project = "gonum"
  ProjectURL = "https://github.com/gonum/gonum"
  Module = "gonum.org/v1/gonum"
  Pattern = "gonum.org/v1/gonum/..."
  Version = "v0.17.0"
  Limit = 50
  BuildFlags = ["-tags", "safe"]
  # Exclude the runner-heavy RDF suite, baseline failures, and the package
  # whose LLGo dependency discovery requested a go.mod rewrite.
  Exclude = [
    "gonum.org/v1/gonum/graph/formats/dot/ast",
    "gonum.org/v1/gonum/graph/formats/dot/internal/astx",
    "gonum.org/v1/gonum/graph/formats/dot/internal/parser",
    "gonum.org/v1/gonum/graph/formats/rdf",
    "gonum.org/v1/gonum/graph/layout",
  ]

[[Projects]]
  NamePrefix = "client_go"
  Project = "kubernetes/client-go"
  ProjectURL = "https://github.com/kubernetes/client-go"
  Module = "k8s.io/client-go"
  Pattern = "k8s.io/client-go/..."
  Version = "v0.36.2"
  Limit = 40
  # These packages failed the Go baseline or LLGo dependency discovery in the
  # first full hosted run, exceeded the practical runner memory/time budget,
  # or timed out while running under LLGo on the Ubuntu qualification host.
  Exclude = [
    "k8s.io/client-go/discovery/cached/disk",
    "k8s.io/client-go/discovery/cached/memory",
    "k8s.io/client-go/dynamic/dynamicinformer",
    "k8s.io/client-go/kubernetes_test",
    "k8s.io/client-go/metadata/metadatainformer",
    "k8s.io/client-go/plugin/pkg/client/auth/exec",
    "k8s.io/client-go/testing/internal",
    "k8s.io/client-go/tools/cache",
    "k8s.io/client-go/tools/leaderelection",
    "k8s.io/client-go/tools/leaderelection/resourcelock",
    "k8s.io/client-go/tools/record",
    "k8s.io/client-go/tools/watch",
  ]

