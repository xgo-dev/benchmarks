# Pinned module inputs for the generated 200-package compatibility manifest.
# Limits are intentionally reviewed: changing package membership changes the
# release-to-release compatibility contract.

[[Projects]]
  NamePrefix = "etcd_pkg"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/pkg/v3"
  Pattern = "go.etcd.io/etcd/pkg/v3/..."
  Version = "v3.6.14"
  Limit = 17

[[Projects]]
  NamePrefix = "etcd_client_pkg"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/client/pkg/v3"
  Pattern = "go.etcd.io/etcd/client/pkg/v3/..."
  Version = "v3.6.14"
  Limit = 8

[[Projects]]
  NamePrefix = "etcd_api"
  Project = "etcd"
  ProjectURL = "https://github.com/etcd-io/etcd"
  Module = "go.etcd.io/etcd/api/v3"
  Pattern = "go.etcd.io/etcd/api/v3/..."
  Version = "v3.6.14"
  Limit = 3

[[Projects]]
  NamePrefix = "protobuf"
  Project = "protobuf-go"
  ProjectURL = "https://github.com/protocolbuffers/protobuf-go"
  Module = "google.golang.org/protobuf"
  Pattern = "google.golang.org/protobuf/..."
  Version = "v1.36.11"
  Limit = 35
  # This package emits an unusually large verbose test stream and repeatedly
  # caused the GitHub-hosted runner to lose communication.
  Exclude = ["google.golang.org/protobuf/encoding/protojson"]

[[Projects]]
  NamePrefix = "gonum"
  Project = "gonum"
  ProjectURL = "https://github.com/gonum/gonum"
  Module = "gonum.org/v1/gonum"
  Pattern = "gonum.org/v1/gonum/..."
  Version = "v0.17.0"
  Limit = 45
  BuildFlags = ["-tags", "safe"]
  # Its RDF canonicalization tests have the same runner-starvation behavior.
  Exclude = ["gonum.org/v1/gonum/graph/formats/rdf"]

[[Projects]]
  NamePrefix = "client_go"
  Project = "kubernetes/client-go"
  ProjectURL = "https://github.com/kubernetes/client-go"
