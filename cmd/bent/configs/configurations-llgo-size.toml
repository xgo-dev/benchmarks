# Six-way binary-size comparison used by ci/llgo-size.
#
# LLGO_BIN and LLGO_LTO_PLUGIN are built by the workflow. LLGo's command is
# Go-compatible but does not support the standard go command's -vet option.
# Each measured build starts from a private cache containing only its required
# standard-library packages. Module dependencies and the target package are
# rebuilt for every benchmark/configuration pair.

[[Configurations]]
  Name = "Go"
  Root = "$GOROOT"
  BuildCache = "stdlib"
  AfterBuild = ["benchsize"]

[[Configurations]]
  Name = "LLGoNoLTO"
  Compiler = "$LLGO_BIN"
  Root = "$GOROOT"
  OmitVetFlag = true
  BuildCache = "stdlib"
  AfterBuild = ["benchsize"]

[[Configurations]]
  Name = "LLGoDeadcodeDrop"
  Compiler = "$LLGO_BIN"
  Root = "$GOROOT"
  OmitVetFlag = true
  BuildCache = "stdlib"
  BuildFlags = ["-deadcodedrop"]
  AfterBuild = ["benchsize"]

[[Configurations]]
  Name = "LLGoFullLTONoGlobalDCE"
  Compiler = "$LLGO_BIN"
  Root = "$GOROOT"
  OmitVetFlag = true
  BuildCache = "stdlib"
  BuildFlags = ["-lto=full", "-globaldce=false"]
  AfterBuild = ["benchsize"]

[[Configurations]]
  Name = "LLGoFullLTOGlobalDCE"
  Compiler = "$LLGO_BIN"
  Root = "$GOROOT"
  OmitVetFlag = true
  BuildCache = "stdlib"
  BuildFlags = ["-lto=full"]
  AfterBuild = ["benchsize"]

[[Configurations]]
  Name = "LLGoFullLTOGlobalDCEPlugin"
  Compiler = "$LLGO_BIN"
  Root = "$GOROOT"
  OmitVetFlag = true
  BuildCache = "stdlib"
  BuildFlags = ["-lto=full", "-lto-pass-plugin=$LLGO_LTO_PLUGIN"]
  AfterBuild = ["benchsize"]
